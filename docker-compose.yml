# docker-compose.yml
version: '3.8'

services:
  # Container 1: The FastAPI Backend
  api:
    build: .
    command: uvicorn src.api.server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env

  # Container 2: The Streamlit Frontend
  ui:
    build: .
    command: streamlit run ui/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - api # Ensures the API starts before the UI